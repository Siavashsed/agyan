<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0a13">
  <title>Gratitude streak - The Lab - Agyan</title>
  <meta name="description" content="One sentence of gratitude a day. Local streak counter. No accounts, no sharing.">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Estedad:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="stylesheet" href="../assets/header.css">
  <script defer src="../assets/header.js"></script>
  <style>
    .gs-shell{max-width:780px;margin:0 auto;padding:64px 24px 96px;color:#f4ebe1}
    .gs-eye{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#e6b9a6;margin-bottom:18px}
    .gs-h1{font-family:'Estedad','Newsreader',serif;font-size:clamp(38px,5.5vw,68px);font-weight:500;line-height:1;letter-spacing:-.025em;margin:0 0 18px}
    .gs-lede{font-size:17px;line-height:1.55;color:rgba(244,235,225,.6);max-width:54ch;margin:0 0 32px}
    .gs-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:36px;padding:24px;background:rgba(230,185,166,.04);border:1px solid rgba(230,185,166,.18);border-radius:8px}
    .gs-stat{text-align:center}
    .gs-stat-val{font-family:'Estedad','Newsreader',serif;font-size:42px;font-weight:500;line-height:1;color:#e6b9a6;letter-spacing:-.03em}
    .gs-stat-lbl{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:rgba(244,235,225,.6);margin-top:6px}
    .gs-prompt{font-family:'Estedad','Newsreader',serif;font-size:20px;line-height:1.4;color:#f4ebe1;margin:0 0 12px;letter-spacing:-.015em}
    textarea#gsText{width:100%;background:rgba(230,185,166,.04);border:1px solid rgba(230,185,166,.18);color:#f4ebe1;padding:14px 16px;font-family:'Newsreader',serif;font-size:17px;line-height:1.55;border-radius:6px;resize:vertical;min-height:96px;margin-bottom:12px}
    textarea#gsText:focus{outline:none;border-color:#e6b9a6}
    .gs-btn{appearance:none;background:#e6b9a6;color:#0d0a13;border:0;padding:14px 28px;font-family:'Estedad',serif;font-size:15px;font-weight:500;border-radius:6px;cursor:pointer;min-height:48px}
    .gs-btn:hover{background:#f0c8b5}
    .gs-grid{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin:32px 0 18px}
    .gs-cell{aspect-ratio:1;border-radius:3px;background:rgba(230,185,166,.06);border:1px solid rgba(230,185,166,.1);position:relative}
    .gs-cell.has{background:#e6b9a6;border-color:#e6b9a6}
    .gs-cell.today{outline:2px solid rgba(230,185,166,.5);outline-offset:1px}
    @media(max-width:520px){.gs-grid{grid-template-columns:repeat(10,1fr)}}
    .gs-list{margin-top:28px;border-top:1px solid rgba(230,185,166,.18);padding-top:24px}
    .gs-list h2{font-family:'Estedad',serif;font-size:18px;font-weight:500;color:#e6b9a6;margin:0 0 14px;letter-spacing:-.01em}
    .gs-item{padding:14px 0;border-bottom:1px solid rgba(230,185,166,.12);font-size:14px;line-height:1.55}
    .gs-item .gs-meta{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(244,235,225,.5);letter-spacing:.1em;margin-bottom:4px}
    .gs-disclaim{font-size:12px;color:rgba(244,235,225,.5);text-align:center;padding-top:18px;border-top:1px solid rgba(230,185,166,.18);margin-top:36px;font-style:italic}
  </style>
</head>
<body>
  <main>
    <div class="gs-shell">
      <div class="gs-eye">LAB / GRATITUDE STREAK</div>
      <h1 class="gs-h1">One line a day.</h1>
      <p class="gs-lede">Local only. No account, no syncing, no one watching. The streak is for you.</p>

      <div class="gs-stats">
        <div class="gs-stat"><div class="gs-stat-val" id="streak">0</div><div class="gs-stat-lbl">Current streak</div></div>
        <div class="gs-stat"><div class="gs-stat-val" id="longest">0</div><div class="gs-stat-lbl">Longest</div></div>
        <div class="gs-stat"><div class="gs-stat-val" id="total">0</div><div class="gs-stat-lbl">Total entries</div></div>
      </div>

      <div class="gs-prompt">What are you grateful for today?</div>
      <textarea id="gsText" placeholder="One thing. Specific. Real."></textarea>
      <button class="gs-btn" id="saveBtn">Save today</button>

      <div class="gs-grid" id="grid" aria-label="Last 30 days"></div>

      <div class="gs-list">
        <h2>Recent entries</h2>
        <div id="items"><div class="gs-item" style="color:rgba(244,235,225,.5)">None yet.</div></div>
      </div>

      <div class="gs-disclaim">This tool is reflective, not prescriptive.</div>
    </div>
  </main>

<script>
(function(){
  var KEY = 'agyan_gratitude';
  function load(){ try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){ return []; } }
  function save(arr){ try { localStorage.setItem(KEY, JSON.stringify(arr)); } catch(e){} }
  function todayStr(){ var d = new Date(); return d.toISOString().slice(0,10); }
  function calcStreak(arr){
    if (!arr.length) return { current:0, longest:0 };
    var dates = arr.map(function(e){ return e.date; }).sort().reverse();
    var setD = new Set(dates);
    var current = 0;
    var d = new Date();
    while (setD.has(d.toISOString().slice(0,10))) { current++; d.setDate(d.getDate() - 1); }
    var longest = 0, run = 0, prev = null;
    var sortedAsc = Array.from(setD).sort();
    sortedAsc.forEach(function(ds){
      if (prev) {
        var diff = (new Date(ds) - new Date(prev)) / 86400000;
        if (diff === 1) run++; else run = 1;
      } else { run = 1; }
      if (run > longest) longest = run;
      prev = ds;
    });
    return { current: current, longest: longest };
  }
  function render(){
    var arr = load();
    var s = calcStreak(arr);
    document.getElementById('streak').textContent  = s.current;
    document.getElementById('longest').textContent = s.longest;
    document.getElementById('total').textContent   = arr.length;

    var grid = document.getElementById('grid'); grid.innerHTML = '';
    var setD = new Set(arr.map(function(e){ return e.date; }));
    var today = todayStr();
    for (var i = 29; i >= 0; i--) {
      var d = new Date(); d.setDate(d.getDate() - i);
      var ds = d.toISOString().slice(0,10);
      var cell = document.createElement('div');
      cell.className = 'gs-cell' + (setD.has(ds) ? ' has' : '') + (ds === today ? ' today' : '');
      cell.title = ds;
      grid.appendChild(cell);
    }

    var box = document.getElementById('items');
    if (!arr.length) { box.innerHTML = '<div class="gs-item" style="color:rgba(244,235,225,.5)">None yet.</div>'; return; }
    var sorted = arr.slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
    box.innerHTML = sorted.slice(0,7).map(function(e){
      return '<div class="gs-item"><span class="gs-meta">' + e.date + '</span>' + escapeHtml(e.text) + '</div>';
    }).join('');
  }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); }

  document.getElementById('saveBtn').addEventListener('click', function(){
    var text = document.getElementById('gsText').value.trim();
    if (!text) { alert('Write one thing first.'); return; }
    var arr = load();
    var today = todayStr();
    var existing = arr.findIndex(function(e){ return e.date === today; });
    if (existing >= 0) { arr[existing].text = text; }
    else { arr.push({ date: today, text: text }); }
    save(arr);
    document.getElementById('gsText').value = '';
    render();
  });
  render();
})();
</script>
</body>
</html>
